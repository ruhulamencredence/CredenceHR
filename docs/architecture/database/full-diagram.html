const zoom=(f,cx,cy)=>{const r=v.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;x=cx-(cx-x)*f;y=cy-(cy-y)*f;k*=f;ap()};
document.getElementById('in').onclick=()=>zoom(1.4);document.getElementById('out').onclick=()=>zoom(1/1.4);
v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();zoom(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});
let d=null;v.addEventListener('pointerdown',e=>{d={x:e.clientX-x,y:e.clientY-y};v.classList.add('drag');v.setPointerCapture(e.pointerId)});
v.addEventListener('pointermove',e=>{if(d){x=e.clientX-d.x;y=e.clientY-d.y;ap()}});v.addEventListener('pointerup',()=>{d=null;v.classList.remove('drag')});
const nodes=[...el.querySelectorAll('g.node')];
document.getElementById('q').addEventListener('input',e=>{const t=e.target.value.trim().toLowerCase();nodes.forEach(n=>n.classList.remove('hit'));if(!t)return;
 const m=nodes.filter(n=>(n.querySelector('title')?.textContent||'').toLowerCase().includes(t));m.forEach(n=>n.classList.add('hit'));
 if(m.length){const bb=m[0].getBBox();const r=v.getBoundingClientRect();k=Math.max(k,0.6);x=r.width/2-(bb.x+bb.width/2)*4/3*k+0;y=r.height/2-(-(bb.y+bb.height/2))*4/3*k*0;
  const tr=m[0].ownerSVGElement.querySelector('g.graph').transform.baseVal.consolidate().matrix;const px=(bb.x+bb.width/2)*tr.a+tr.e,py=(bb.y+bb.height/2)*tr.d+tr.f;
  x=r.width/2-px*4/3*k;y=r.height/2-py*4/3*k;ap()}});
</script></body></html>
