<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- maximum-scale=1: the iPhone zooms the whole page in when a field is
         tapped and stays zoomed (text and icons then sit outside the screen). -->
    <!-- Colors the browser chrome (Android Chrome's top strip, iOS Safari
         status bar, PWA install) to match the app header's purple gradient
         (linear-gradient(90deg, #7F00FF 0%, #6300C6 50%, #47008E 100%) — see
         Navbar.tsx/WelcomeBanner.tsx) instead of the OS default black/white.
         Same mid-stop color the native Android app uses via
         StatusBar.setBackgroundColor() in App.tsx, so web and native match. -->
    <meta name="theme-color" content="#6300C6" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- "Add to Home Screen" (iPhone Safari, Android Chrome): opens full
         screen like an app, with the CredenceHR icon and name. The iPhone
         reads the apple-* tags; everything else reads the manifest. The
         layout already leaves room for the status bar / home indicator via
         env(safe-area-inset-*). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CredenceHR" />
    <link rel="apple-touch-icon" href="/icons/app-180.png?v=smile1" />
    <title>CredenceHR</title>
    <meta name="description" content="CredenceHR by Credence." />
    <meta property="og:title" content="CredenceHR" />
    <meta property="og:description" content="CredenceHR by Credence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Dark mode (src/lib/colorMode.ts), before the first paint. -->
    <script>
      try { var m = localStorage.getItem('mpr_color_mode'); if (m === 'dark' || m === 'glass' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-dark', ''); if (m === 'glass') document.documentElement.setAttribute('data-glass', ''); if (m === 'lightglass') document.documentElement.setAttribute('data-lglass', ''); } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png?v=smile1" />
  </head>

    <div id="root">
      <!-- Static, JS-free first frame — shows the INSTANT the HTML arrives,
           before the (much larger) JS bundle has even started downloading.
           React's first render on main.tsx replaces this div's content.

           It is the same picture as the Android app's native splash
           (android/app/src/main/res/drawable*/splash.png) and the first frame
           of the launch animation (src/components/BootIntroAnimation.tsx):
           the orange gradient with the smile-curve app icon in the middle, as
           big as the animation's first frame (112 px on a 360 px wide phone,
           scaled with the width, 95-140 px) — so splash -> WebView ->
           animation shows no visible change. The icon is inlined (WebP,
           ~10 KB, same file as src/assets/boot/app-icon-336.webp) so it is
           there on the first paint, with no request to wait for. -->
      <style>
        #mpr-boot-spinner { position: fixed; inset: 0; background: linear-gradient(160deg, #ff9238 0%, #f47920 45%, #e2600e 100%); }

        #mpr-boot-spinner { --boot-icon: clamp(95.2px, 31.111vw, 140px); }
