# Android app build on GitHub's cloud machine (Android SDK preinstalled).
#
# Builds a debug APK of the Capacitor Android project so every native change
# (Capacitor / plugin upgrades, permissions, MainActivity) is proven to
# compile. Download "CredenceHR-android-debug" from the run's Artifacts to
# install it on a phone for testing.
#
# The app loads its screens from the server (capacitor.config.ts), so the
# build only needs rebuilding for native changes — not for every web change.

name: Android build

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server the app opens (scheme, no trailing slash)"
        required: false
        default: "https://hr.credencehousinglimited.com"
  push:
    branches: [main, claude/nice-fermi-0tale9]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

env:
  CAP_SERVER_URL: ${{ github.event.inputs.server_url || 'https://hr.credencehousinglimited.com' }}

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8: Node 22 for the CLI, Java 21 for the Android build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync the Android project
        run: |
          npx vite build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report target SDK
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|sdkVersion|targetSdkVersion"

      - uses: actions/upload-artifact@v4
        with:
          name: CredenceHR-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
