# Keeps docs/architecture in step with the code. On every push that touches
# code, schema, packages or the docs it: builds an empty MariaDB by starting
# the server once (schema.sql + every ensure*Schema), regenerates the database
# README / data dictionary / all ER images / draw.io file, the Access Matrix
# (src/types.ts), the SBOM (package-lock.json) and every HTML page, then
# commits the result back to the same branch — except the one-file HTML
# bundles and the full-database PNG / PDF, which go to the run's artifact
# "CredenceHR-documentation" (they grew the repo ~13 MB a push). Things only a person can write
# (a new library's purpose, a changed workflow) show up as warnings in the
# run summary. Run it by hand from Actions -> "Docs sync" -> Run workflow.

name: Docs sync

on:
  workflow_dispatch:
  push:
    branches: [main, claude/nice-fermi-0tale9]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "schema.sql"
      - "package.json"
      - "package-lock.json"
      - "docs/architecture/**"
      - ".github/workflows/docs-sync.yml"

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: docs
          MARIADB_DATABASE: docs_schema
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: docs
      DB_NAME: docs_schema
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm ci
          pip install markdown
          # Playwright (diagram images) lives outside package.json on purpose.
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build the database schema
        run: bash docs/architecture/tools/db/build_schema.sh

      - name: Regenerate documentation
        run: node docs/architecture/tools/sync_docs.mjs --db

      # The one-file HTML bundles and the full-database PNG / PDF are not
      # committed (.gitignore): each run's copy is kept here instead.
      - name: Keep the big generated files as this run's artifact
        uses: actions/upload-artifact@v4
        with:
          name: CredenceHR-documentation
          retention-days: 90
          if-no-files-found: warn
          path: |
            docs/architecture/CredenceHR-Documentation.html
            docs/architecture/CredenceHR-Full-Workflow.html
            docs/architecture/database/diagrams/full-application-er.png
            docs/architecture/database/diagrams/full-application-er.pdf

      - name: Commit the updated documentation
        run: |
          git add -A docs/architecture
          if git diff --cached --quiet; then echo "Documentation already up to date."; exit 0; fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: auto-sync architecture docs with ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push the documentation update"; exit 1
